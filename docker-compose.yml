services:
  # MQTT broker used by simulators, cleaners, ingest, HAR live mode, and Grafana.
  emqx:
    image: emqx:latest
    container_name: emqx
    ports:
      - "2883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # InfluxDB 3 stores generic events, structured sensor rows, and HAR predictions.
  influxdb3:
    image: influxdb:3-core
    container_name: influxdb3
    user: "0:0"
    command: ["influxdb3", "serve", "--node-id", "node0"]
    ports:
      - "8181:8181"
    volumes:
      - influxdb3_data:/root/.influxdb
    restart: always

  # FastAPI service that subscribes to MQTT and writes normalized data to InfluxDB.
  ingest-service:
    build:
      context: ./services/ingest_service
      dockerfile: Dockerfile
    container_name: ingest-service
    depends_on:
      emqx:
        condition: service_healthy
      influxdb3:
        condition: service_started
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: always

  # Optional InfluxDB browser for manual SQL queries and table inspection.
  influxdb3-explorer:
    image: influxdata/influxdb3-ui:1.6.2
    container_name: influxdb3-explorer
    ports:
      - "8888:80"
    restart: unless-stopped
    depends_on:
      - influxdb3

  # Siddha IMU dataset replay. Start with `docker compose --profile replay up`.
  siddha-sensor-sim:
    profiles: ["replay"]
    build:
      context: ./services/siddha_sensor_sim
      dockerfile: Dockerfile
    container_name: siddha-sensor-sim
    env_file:
      - .env
    depends_on:
      emqx:
        condition: service_healthy
    volumes:
      - ./dataset:/app/dataset:ro
    restart: on-failure

  # EEG OpenNeuro replay for Phase 6 validation.
  eeg-dataset-sim:
    profiles: ["phase6"]
    build:
      context: ./services/eeg_dataset_sim
      dockerfile: Dockerfile
    container_name: eeg-dataset-sim
    env_file:
      - .env
    depends_on:
      emqx:
        condition: service_healthy
      ingest-service:
        condition: service_started
      eeg-cleaner-service:
        condition: service_started
    volumes:
      - ./dataset:/app/dataset:ro
    restart: on-failure

  # Validates raw EEG replay rows and publishes canonical clean EEG rows.
  eeg-cleaner-service:
    profiles: ["phase6"]
    build:
      context: ./services/eeg_cleaner_service
      dockerfile: Dockerfile
    container_name: eeg-cleaner-service
    env_file:
      - .env
    depends_on:
      emqx:
        condition: service_healthy
      ingest-service:
        condition: service_started
      ecg-cleaner-service:
        condition: service_started
    restart: unless-stopped

  # ECG OpenNeuro replay for Phase 6 validation.
  ecg-dataset-sim:
    profiles: ["phase6"]
    build:
      context: ./services/ecg_dataset_sim
      dockerfile: Dockerfile
    container_name: ecg-dataset-sim
    env_file:
      - .env
    depends_on:
      emqx:
        condition: service_healthy
    volumes:
      - ./dataset:/app/dataset:ro
    restart: on-failure

  # Validates raw ECG replay rows and publishes canonical clean ECG rows.
  ecg-cleaner-service:
    profiles: ["phase6"]
    build:
      context: ./services/ecg_cleaner_service
      dockerfile: Dockerfile
    container_name: ecg-cleaner-service
    env_file:
      - .env
    depends_on:
      emqx:
        condition: service_healthy
    restart: unless-stopped

  # Runs HAR inference from stored dataset rows or live watch MQTT rows.
  har-service:
    build:
      context: ./services/har_service
      dockerfile: Dockerfile
    container_name: har-service
    env_file:
      - .env
    depends_on:
      emqx:
        condition: service_healthy
      influxdb3:
        condition: service_started
    restart: unless-stopped


  # Pairs raw MetaWear ACC/GYRO messages into canonical clean IMU rows.
  watch-cleaner-service:
    build:
      context: ./services/watch_cleaner_service
      dockerfile: Dockerfile
    container_name: watch-cleaner-service
    env_file:
      - .env
    depends_on:
      emqx:
        condition: service_healthy
    restart: unless-stopped

  # Dashboards for MQTT live streams, InfluxDB tables, and HAR predictions.
  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-mqtt-datasource
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s

      # This passes the token from `.env` into the Grafana container.
      INFLUX_TOKEN: ${INFLUX_TOKEN}

    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb3
      - emqx
    restart: unless-stopped

volumes:
  influxdb3_data:
  grafana_data:
