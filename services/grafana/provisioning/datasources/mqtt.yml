apiVersion: 1

# Live MQTT datasource used by panels that subscribe directly to broker topics.
datasources:
  - name: MQTT-Live
    uid: mqtt_live
    type: grafana-mqtt-datasource
    jsonData:
      uri: tcp://emqx:1883
      clientID: grafana-mqtt-live
      tlsAuth: false
      tlsAuthWithCACert: false
      tlsSkipVerify: false
