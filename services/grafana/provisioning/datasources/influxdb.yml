apiVersion: 1

# SQL datasource for InfluxDB 3. The token is injected from docker-compose.yml.
datasources:
  - name: InfluxDB3-Tennis
    uid: influxdb3_tennis
    type: influxdb
    access: proxy
    url: http://influxdb3:8181
    isDefault: true
    jsonData:
      version: SQL
      dbName: tennis
      insecureGrpc: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
