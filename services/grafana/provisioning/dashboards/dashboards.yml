apiVersion: 1

# Grafana loads dashboard JSON files from the mounted dashboards directory.
providers:
  - name: smart-tennis-field
    orgId: 1
    folder: Smart Tennis Field
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
