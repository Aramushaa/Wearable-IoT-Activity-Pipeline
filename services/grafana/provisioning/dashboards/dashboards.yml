apiVersion: 1

# Grafana loads dashboard JSON files from the mounted dashboards directory.
providers:
  - name: wearable-sensors
    orgId: 1
    folder: Wearable Sensors
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards